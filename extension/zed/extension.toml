# The Zed extension for Decl (docs/tooling/04_extension.md §14–§16):
# the grammar, the language, and where decl-lsp is.
id = "decl"
name = "Decl"
description = "Decl — a declarative language for describing, generating, and validating structured data: syntax, outline, runnables, and the decl-lsp language server"
version = "0.3.0"
schema_version = 1
authors = ["luuvish <luuvish@gmail.com>"]
repository = "https://github.com/luuvish/decl-lang"

# the grammar is fetched with git at the pinned commit and compiled by Zed;
# the repository is private for now, so the URL is the ssh one your key
# opens — switch to https://github.com/luuvish/decl-lang when it is public
[grammars.decl]
repository = "git@github.com:luuvish/decl-lang.git"
path = "tree-sitter-decl"
rev = "5ff7c1aed2914eb9c1e7266c20e678f3f718deb6"

[language_servers.decl-lsp]
name = "decl-lsp"
languages = ["Decl"]
