name = "Decl"
grammar = "decl"
path_suffixes = ["decl"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
tab_size = 4
hard_tabs = false
# `$this`, `$referrers`, and a hidden member `name$` are one word
word_characters = ["$"]
