kind: node.ic
address_maps:
  - - base: 0
      size: 268435456
      dest:
        - mi0
    - base: 268435456
      size: 268435456
      dest:
        - mi1
enable_pmu: true
enable_cmu: true
ports:
  si0:
    kind: ext
    mode: si
    width: 64
  si1:
    kind: ext
    mode: si
    width: 64
  mi0:
    kind: ext
    mode: mi
    width: 64
  mi1:
    kind: ext
    mode: mi
    width: 64
nodes:
  dom0:
    kind: node.dom
    ports:
      si0:
        kind: int
        mode: si
        feeders:
          - "$.edges[0]"
        width: 64
      si1:
        kind: int
        mode: si
        feeders:
          - "$.edges[1]"
        width: 64
      mi0:
        kind: int
        mode: mi
        feeders:
          - "$.nodes[\"dom0\"].edges[10]"
        width: 64
      mi1:
        kind: int
        mode: mi
        feeders:
          - "$.nodes[\"dom0\"].edges[11]"
        width: 64
    nodes:
      mst0:
        kind: node.mst
        enable_rob: false
        ports:
          si:
            kind: int
            mode: si
            feeders:
              - "$.nodes[\"dom0\"].edges[0]"
            width: 64
          mi:
            kind: int
            mode: mi
            feeders:
              - "$.nodes[\"dom0\"].nodes[\"mst0\"].wired[0]"
            width: 64
        wired:
          - source: "$.nodes[\"dom0\"].nodes[\"mst0\"].ports.si"
            target: "$.nodes[\"dom0\"].nodes[\"mst0\"].ports.mi"
      mst1:
        kind: node.mst
        enable_rob: false
        ports:
          si:
            kind: int
            mode: si
            feeders:
              - "$.nodes[\"dom0\"].edges[1]"
            width: 64
          mi:
            kind: int
            mode: mi
            feeders:
              - "$.nodes[\"dom0\"].nodes[\"mst1\"].wired[0]"
            width: 64
        wired:
          - source: "$.nodes[\"dom0\"].nodes[\"mst1\"].ports.si"
            target: "$.nodes[\"dom0\"].nodes[\"mst1\"].ports.mi"
      dec0:
        kind: node.dec
        ports:
          si:
            kind: int
            mode: si
            feeders:
              - "$.nodes[\"dom0\"].edges[2]"
            width: 64
          outs:
            mi0:
              kind: int
              mode: mi
              feeders:
                - "$.nodes[\"dom0\"].nodes[\"dec0\"].wired[0]"
              width: 64
            mi1:
              kind: int
              mode: mi
              feeders:
                - "$.nodes[\"dom0\"].nodes[\"dec0\"].wired[1]"
              width: 64
        fan_out: 2
        wired:
          - source: "$.nodes[\"dom0\"].nodes[\"dec0\"].ports.si"
            target: "$.nodes[\"dom0\"].nodes[\"dec0\"].ports.outs[\"mi0\"]"
          - source: "$.nodes[\"dom0\"].nodes[\"dec0\"].ports.si"
            target: "$.nodes[\"dom0\"].nodes[\"dec0\"].ports.outs[\"mi1\"]"
      dec1:
        kind: node.dec
        ports:
          si:
            kind: int
            mode: si
            feeders:
              - "$.nodes[\"dom0\"].edges[3]"
            width: 64
          outs:
            mi0:
              kind: int
              mode: mi
              feeders:
                - "$.nodes[\"dom0\"].nodes[\"dec1\"].wired[0]"
              width: 64
            mi1:
              kind: int
              mode: mi
              feeders:
                - "$.nodes[\"dom0\"].nodes[\"dec1\"].wired[1]"
              width: 64
        fan_out: 2
        wired:
          - source: "$.nodes[\"dom0\"].nodes[\"dec1\"].ports.si"
            target: "$.nodes[\"dom0\"].nodes[\"dec1\"].ports.outs[\"mi0\"]"
          - source: "$.nodes[\"dom0\"].nodes[\"dec1\"].ports.si"
            target: "$.nodes[\"dom0\"].nodes[\"dec1\"].ports.outs[\"mi1\"]"
      arb0:
        kind: node.arb
        ports:
          mi:
            kind: int
            mode: mi
            feeders:
              - "$.nodes[\"dom0\"].nodes[\"arb0\"].wired[0]"
              - "$.nodes[\"dom0\"].nodes[\"arb0\"].wired[1]"
            width: 64
          ins:
            si0:
              kind: int
              mode: si
              feeders:
                - "$.nodes[\"dom0\"].edges[4]"
              width: 64
            si1:
              kind: int
              mode: si
              feeders:
                - "$.nodes[\"dom0\"].edges[6]"
              width: 64
        fan_in: 2
        wired:
          - source: "$.nodes[\"dom0\"].nodes[\"arb0\"].ports.ins[\"si0\"]"
            target: "$.nodes[\"dom0\"].nodes[\"arb0\"].ports.mi"
          - source: "$.nodes[\"dom0\"].nodes[\"arb0\"].ports.ins[\"si1\"]"
            target: "$.nodes[\"dom0\"].nodes[\"arb0\"].ports.mi"
      arb1:
        kind: node.arb
        ports:
          mi:
            kind: int
            mode: mi
            feeders:
              - "$.nodes[\"dom0\"].nodes[\"arb1\"].wired[0]"
              - "$.nodes[\"dom0\"].nodes[\"arb1\"].wired[1]"
            width: 64
          ins:
            si0:
              kind: int
              mode: si
              feeders:
                - "$.nodes[\"dom0\"].edges[5]"
              width: 64
            si1:
              kind: int
              mode: si
              feeders:
                - "$.nodes[\"dom0\"].edges[7]"
              width: 64
        fan_in: 2
        wired:
          - source: "$.nodes[\"dom0\"].nodes[\"arb1\"].ports.ins[\"si0\"]"
            target: "$.nodes[\"dom0\"].nodes[\"arb1\"].ports.mi"
          - source: "$.nodes[\"dom0\"].nodes[\"arb1\"].ports.ins[\"si1\"]"
            target: "$.nodes[\"dom0\"].nodes[\"arb1\"].ports.mi"
      slv0:
        kind: node.slv
        enable_rob: false
        ports:
          si:
            kind: int
            mode: si
            feeders:
              - "$.nodes[\"dom0\"].edges[8]"
            width: 64
          mi:
            kind: int
            mode: mi
            feeders:
              - "$.nodes[\"dom0\"].nodes[\"slv0\"].wired[0]"
            width: 64
        wired:
          - source: "$.nodes[\"dom0\"].nodes[\"slv0\"].ports.si"
            target: "$.nodes[\"dom0\"].nodes[\"slv0\"].ports.mi"
      slv1:
        kind: node.slv
        enable_rob: false
        ports:
          si:
            kind: int
            mode: si
            feeders:
              - "$.nodes[\"dom0\"].edges[9]"
            width: 64
          mi:
            kind: int
            mode: mi
            feeders:
              - "$.nodes[\"dom0\"].nodes[\"slv1\"].wired[0]"
            width: 64
        wired:
          - source: "$.nodes[\"dom0\"].nodes[\"slv1\"].ports.si"
            target: "$.nodes[\"dom0\"].nodes[\"slv1\"].ports.mi"
    edges:
      - source: "$.nodes[\"dom0\"].ports[\"si0\"]"
        target: "$.nodes[\"dom0\"].nodes[\"mst0\"].ports.si"
      - source: "$.nodes[\"dom0\"].ports[\"si1\"]"
        target: "$.nodes[\"dom0\"].nodes[\"mst1\"].ports.si"
      - source: "$.nodes[\"dom0\"].nodes[\"mst0\"].ports.mi"
        target: "$.nodes[\"dom0\"].nodes[\"dec0\"].ports.si"
      - source: "$.nodes[\"dom0\"].nodes[\"mst1\"].ports.mi"
        target: "$.nodes[\"dom0\"].nodes[\"dec1\"].ports.si"
      - source: "$.nodes[\"dom0\"].nodes[\"dec0\"].ports.outs[\"mi0\"]"
        target: "$.nodes[\"dom0\"].nodes[\"arb0\"].ports.ins[\"si0\"]"
      - source: "$.nodes[\"dom0\"].nodes[\"dec0\"].ports.outs[\"mi1\"]"
        target: "$.nodes[\"dom0\"].nodes[\"arb1\"].ports.ins[\"si0\"]"
      - source: "$.nodes[\"dom0\"].nodes[\"dec1\"].ports.outs[\"mi0\"]"
        target: "$.nodes[\"dom0\"].nodes[\"arb0\"].ports.ins[\"si1\"]"
      - source: "$.nodes[\"dom0\"].nodes[\"dec1\"].ports.outs[\"mi1\"]"
        target: "$.nodes[\"dom0\"].nodes[\"arb1\"].ports.ins[\"si1\"]"
      - source: "$.nodes[\"dom0\"].nodes[\"arb0\"].ports.mi"
        target: "$.nodes[\"dom0\"].nodes[\"slv0\"].ports.si"
      - source: "$.nodes[\"dom0\"].nodes[\"arb1\"].ports.mi"
        target: "$.nodes[\"dom0\"].nodes[\"slv1\"].ports.si"
      - source: "$.nodes[\"dom0\"].nodes[\"slv0\"].ports.mi"
        target: "$.nodes[\"dom0\"].ports[\"mi0\"]"
      - source: "$.nodes[\"dom0\"].nodes[\"slv1\"].ports.mi"
        target: "$.nodes[\"dom0\"].ports[\"mi1\"]"
    enable_int: false
edges:
  - source: "$.ports[\"si0\"]"
    target: "$.nodes[\"dom0\"].ports[\"si0\"]"
  - source: "$.ports[\"si1\"]"
    target: "$.nodes[\"dom0\"].ports[\"si1\"]"
  - source: "$.nodes[\"dom0\"].ports[\"mi0\"]"
    target: "$.ports[\"mi0\"]"
  - source: "$.nodes[\"dom0\"].ports[\"mi1\"]"
    target: "$.ports[\"mi1\"]"
