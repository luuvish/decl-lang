[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decl-lang"
version = "0.3.0"
description = "Decl — a declarative language for describing, generating, and validating structured data: the decl CLI (check / evaluate / validate / fmt), the decl-lsp language server, and a Python API, implemented natively"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "luuvish" }]
keywords = ["decl", "declarative", "schema", "validation", "configuration", "json", "language", "lsp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["tree-sitter>=0.25"]

[project.scripts]
decl = "decl.cli:main"
decl-lsp = "decl.lsp:main"

[project.urls]
Homepage = "https://github.com/luuvish/decl-lang"
Repository = "https://github.com/luuvish/decl-lang"
Issues = "https://github.com/luuvish/decl-lang/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["decl", "decl._tree_sitter"]

# src/decl/_tree_sitter/src/ (grammar C sources) is synced from ../tree-sitter-decl
# by `npm run build` in ../decl-ts (or by setup.py) and gitignored
[tool.setuptools.package-data]
"decl._tree_sitter" = ["binding.c", "_binding.pyi", "src/*.c", "src/tree_sitter/*.h"]

# ---------------------------------------------------------------- development tooling
# `pip install -e '.[dev]'`; ruff (lint + format), mypy, pytest — see the
# Makefile's test-python target and docs/ENVIRONMENT.md
[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/decl/_tree_sitter/src", ".venv", "build", "dist"]

[tool.ruff.lint]
# D1: a docstring on every public module, class, and function of the package's API
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D1"]
# E741: the port keeps the reference implementation's names (AGENTS.md), `l` included;
# D107: a class's docstring describes its construction
ignore = ["E741", "D107"]

[tool.ruff.lint.per-file-ignores]
# the corpus drivers: sections import as they go, and the Decl sources they feed are kept whole
"scripts/*.py" = ["E402", "E501", "D1"]
# the tests and the ports' internal modules are held to the reference's shape, not to docstrings
"tests/**/*.py" = ["D1"]
"src/decl/{checker,cli,conformance,engine,fmt,infer,lsp,module,package,parse,pipeline,repl,semantics,session,subsume}.py" = ["D1"]
"src/decl/_tree_sitter/*.py" = ["D1"]

[tool.ruff.lint.isort]
known-first-party = ["decl"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
# the AST and the values are dict-shaped (`dict[str, Any]`, the reference's JSON-like objects),
# so most functions hand back an Any-derived value: warning on every such return adds casts, not safety
warn_return_any = false
files = ["src/decl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/<corpus>_test.py and tests/internal/<module>_test.py share basenames (fmt_test.py):
# importlib mode gives each its own module name, no __init__.py or sys.path games
addopts = "--import-mode=importlib"
