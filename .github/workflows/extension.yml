# The VS Code extension's tests (docs/tooling/04_extension.md §20): the
# suite runs inside a downloaded VS Code against the bundled reference
# server. Separate from the gate (`verify`): it downloads an editor.
name: extension

on:
  push:
    branches: [main]
    paths: ['extension/**', 'decl-ts/**', 'site/grammars/**', 'tree-sitter-decl/**', '.github/workflows/extension.yml']
  pull_request:
    paths: ['extension/**', 'decl-ts/**', 'site/grammars/**', 'tree-sitter-decl/**', '.github/workflows/extension.yml']
  workflow_dispatch:

jobs:
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: |
          for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
          rust=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml); echo "rust=$rust" >> "$GITHUB_OUTPUT"
          test "$rust" = "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" || { echo "rust-toolchain.toml does not match mise.toml"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - run: npm ci
      - run: npm run build -w decl-lang
      - run: xvfb-run -a npm test -w vscode-decl
      - if: always()
        run: cat extension/vscode/dist/test/results.txt || true
  # the web extension: the browser suite in VS Code for the Web (a headless Chromium)
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: |
          for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
          rust=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml); echo "rust=$rust" >> "$GITHUB_OUTPUT"
          test "$rust" = "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" || { echo "rust-toolchain.toml does not match mise.toml"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w decl-lang
      - run: npm run test:web -w vscode-decl
  # the Zed extension: the wasm module builds, the manifest is whole, the queries load against the grammar
  zed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: |
          for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
          rust=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml); echo "rust=$rust" >> "$GITHUB_OUTPUT"
          test "$rust" = "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" || { echo "rust-toolchain.toml does not match mise.toml"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extension/zed
      - run: npm ci
      - run: extension/zed/test.sh
  # the same suite against the Rust server (on demand: it builds the crate)
  vscode-rust:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: |
          for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
          rust=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml); echo "rust=$rust" >> "$GITHUB_OUTPUT"
          test "$rust" = "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" || { echo "rust-toolchain.toml does not match mise.toml"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build -w decl-lang
      - run: cargo build --release --bin decl-lsp
      - run: DECL_SERVER_PATH=target/release/decl-lsp xvfb-run -a npm test -w vscode-decl
      - if: always()
        run: cat extension/vscode/dist/test/results.txt || true
