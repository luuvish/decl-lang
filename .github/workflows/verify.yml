# The gate: each implementation's own tests, then the parity check that
# the TypeScript reference, the Rust runtime, and the Python runtime are
# byte-for-byte indistinguishable (tests/parity/differential.py).
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the toolchains exactly as a developer gets them: `mise install` from mise.toml
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: mise current && test "$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)" = "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      - uses: Swatinem/rust-cache@v2
      - run: make verify

  # each language's linter, type checker, and formatter in check mode (make lint)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: make lint

  # the Python package installed and run on Windows, as the release's wheels are
  # there and as nothing else is before a tag: CPython on Windows differs from the
  # platforms the gate runs on (it admits a smaller thread stack), and the wheels'
  # own `decl --version` runs only when a release builds them
  windows:
    name: python on windows
    runs-on: windows-latest
    steps:
      # the goldens are compared byte for byte: no CRLF conversion on Windows
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v7
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pins.outputs.python }}
      # the grammar sources the extension compiles are synced by the reference build
      - run: npm ci
      - run: npm run build -w decl-lang
      - run: python -m pip install ./decl-py
      - name: the installed command reports its version and evaluates two examples to their goldens
        shell: bash
        run: |
          decl --version
          decl-lsp --version
          decl evaluate docs/examples/01_interconnect.decl | diff - tests/golden/docs__examples__01_interconnect.json
          decl evaluate docs/examples/02_config.decl | diff - tests/golden/docs__examples__02_config.json

  # the minimums the manifests declare, each checked with exactly that version:
  # rust-version (decl-rs/Cargo.toml), engines.node (decl-ts/package.json),
  # requires-python (decl-py/pyproject.toml)
  minimums:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: rust 1.90, rust: '1.90', node: '', python: '' }
          - { name: node 22,   rust: '',     node: '22', python: '' }
          - { name: python 3.10, rust: '',   node: '', python: '3.10' }
    name: minimum ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: matrix.rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - if: matrix.rust
        run: rm rust-toolchain.toml && cargo check --locked --all-targets -p decl-lang
      - if: matrix.node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: matrix.node
        run: npm ci && npm test -w decl-lang
      - if: matrix.python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.python
        run: make test-python
