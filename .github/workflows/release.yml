# A release (docs/tooling/04_extension.md §18, packaging/README.md): on a
# version tag, the prebuilt `decl` and `decl-lsp` binaries for macOS,
# Linux, and Windows on arm64 and x86_64 — the Linux ones static against
# musl, no glibc dependency — the VS Code extension's .vsix, the Python
# wheels for the same platforms, and, when the tokens are configured,
# the extension's publication. The registries of the language itself
# (npm, PyPI, crates.io) keep the packaging/README.md checklist.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: publish the wheels and the sdist to PyPI (trusted publishing), as a tag does
        type: boolean
        default: false
      publish_npm:
        description: publish decl-lang to npm (trusted publishing), as a tag does
        type: boolean
        default: false
      publish_crates:
        description: publish decl-lang to crates.io (trusted publishing), as a tag does
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  binaries:
    name: decl + decl-lsp ${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  suffix: linux-x86_64,   musl: true,  ext: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, suffix: linux-arm64,    musl: true,  ext: '' }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,        suffix: macos-x86_64,   musl: false, ext: '' }
          - { os: macos-latest,     target: aarch64-apple-darwin,       suffix: macos-arm64,    musl: false, ext: '' }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     suffix: windows-x86_64, musl: false, ext: .exe }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,    suffix: windows-arm64,  musl: false, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      # the goldens are compared byte for byte: no CRLF conversion on Windows
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v7
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: |
          for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
          rust=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml); echo "rust=$rust" >> "$GITHUB_OUTPUT"
          test "$rust" = "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" || { echo "rust-toolchain.toml does not match mise.toml"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.musl
        name: the musl C toolchain (the grammar and the tree-sitter runtime are C)
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # the grammar sources the crate compiles are synced by the reference build
      - run: npm ci
      - run: npm run build -w decl-lang
      - name: build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p decl-lang --bin decl --bin decl-lsp
      - name: name the assets; a Linux binary must be static; the binary must evaluate an example to its golden
        shell: bash
        run: |
          mkdir -p assets
          for bin in decl decl-lsp; do
            cp "target/${{ matrix.target }}/release/$bin${{ matrix.ext }}" "assets/$bin-${{ matrix.suffix }}${{ matrix.ext }}"
          done
          if [ "${{ matrix.musl }}" = "true" ]; then
            # x86_64 musl binaries are position-independent ("static-pie linked"); aarch64 ones "statically linked"
            for bin in decl decl-lsp; do
              file "assets/$bin-${{ matrix.suffix }}" | grep -qE "statically linked|static-pie linked" || { echo "$bin is not static"; file "assets/$bin-${{ matrix.suffix }}"; exit 1; }
            done
          fi
          decl="assets/decl-${{ matrix.suffix }}${{ matrix.ext }}"
          "$decl" --version
          "$decl" evaluate docs/examples/01_interconnect.decl | diff - tests/golden/docs__examples__01_interconnect.json
          "$decl" evaluate docs/examples/02_config.decl | diff - tests/golden/docs__examples__02_config.json
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.suffix }}
          path: assets/*

  wheels:
    name: Python wheels ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    archs: x86_64 }
          - { os: ubuntu-24.04-arm, archs: aarch64 }
          - { os: macos-15-intel,   archs: x86_64 }
          - { os: macos-latest,     archs: arm64 }
          - { os: windows-latest,   archs: AMD64 }
          - { os: windows-11-arm,   archs: ARM64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: |
          for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
          rust=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml); echo "rust=$rust" >> "$GITHUB_OUTPUT"
          test "$rust" = "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" || { echo "rust-toolchain.toml does not match mise.toml"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pins.outputs.python }}
      # the grammar sources the extension compiles are synced by the reference build
      - run: npm ci
      - run: npm run build -w decl-lang
      - name: "build the wheels (Linux: manylinux and musllinux; Windows arm64 from CPython 3.11, the first with an arm64 build)"
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # the CPython versions requires-python admits (pyproject.toml) that are not end of life
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-win32 pp* cp310-win_arm64'
          CIBW_TEST_COMMAND: 'decl --version'
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel decl-py --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: |
          for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pins.outputs.python }}
      # the grammar sources the sdist carries are synced by the reference build
      - run: npm ci
      - run: npm run build -w decl-lang
      - run: python -m pip install build twine
      - run: python -m build --sdist decl-py --outdir sdist && python -m twine check sdist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: sdist/*.tar.gz

  # PyPI through trusted publishing (no token: the workflow's OIDC identity is
  # registered on pypi.org for this repository, this file, and the `pypi`
  # environment); on a tag, or on a dispatch that asks for it
  publish-pypi:
    name: PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # npm through trusted publishing: the workflow's OIDC identity is registered
  # on npmjs.com for this repository, this file, and the `npm` environment;
  # npm attaches provenance. prepublishOnly builds, tests, and smokes the tarball.
  publish-npm:
    name: npm
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: |
          for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.pins.outputs.node }}
          registry-url: https://registry.npmjs.org
          cache: npm
      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest && npm --version
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - run: npm publish --access public -w decl-lang

  # crates.io through trusted publishing: the identity is registered on
  # crates.io for this repository, this file, and the `crates-io` environment;
  # the auth action turns it into a one-time token for cargo
  publish-crates:
    name: crates.io
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_crates
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: |
          for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
          rust=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml); echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
      # the crate packages the grammar sources and the LICENSE the reference build copies in
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - run: npm run build -w decl-lang
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish -p decl-lang --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  vsix:
    name: vscode-decl .vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pins
        name: the pinned versions (mise.toml)
        shell: bash
        run: |
          for t in node python; do echo "$t=$(sed -n "s/^$t = \"\(.*\)\"/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"; done
          rust=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml); echo "rust=$rust" >> "$GITHUB_OUTPUT"
          test "$rust" = "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" || { echo "rust-toolchain.toml does not match mise.toml"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
      - run: npm ci
      - run: npm run build -w decl-lang
      - run: npm run build -w vscode-decl
      - run: cd extension/vscode && npx @vscode/vsce package --no-dependencies -o ../../vscode-decl.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-decl.vsix
          path: vscode-decl.vsix
      - name: publish to the Marketplace and Open VSX (when the tokens are configured)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then npx @vscode/vsce publish --packagePath vscode-decl.vsix -p "$VSCE_PAT"; else echo "VSCE_PAT not set: skipping the Marketplace"; fi
          if [ -n "$OVSX_PAT" ]; then npx ovsx publish vscode-decl.vsix -p "$OVSX_PAT"; else echo "OVSX_PAT not set: skipping Open VSX"; fi

  release:
    name: GitHub release
    needs: [binaries, wheels, sdist, vsix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
