# Dependencies move forward deliberately (docs/DEVELOPMENT.md §6): once a
# month, per ecosystem, one pull request with the minor and patch updates
# (mergeable when the gate passes) and one with the majors (a planned
# update: they change code, and tree-sitter moves the grammar, the three
# implementations, and the Zed API together).
version: 2
updates:
  - package-ecosystem: cargo
    directories: ['/', '/extension/zed']
    schedule: { interval: monthly }
    groups:
      cargo-minor-patch: { patterns: ['*'], update-types: ['minor', 'patch'] }
      cargo-major: { patterns: ['*'], update-types: ['major'] }
  - package-ecosystem: npm
    directory: '/'
    schedule: { interval: monthly }
    groups:
      npm-minor-patch: { patterns: ['*'], update-types: ['minor', 'patch'] }
      npm-major: { patterns: ['*'], update-types: ['major'] }
    ignore:
      # a TypeScript major is taken by hand, when typescript-eslint supports it
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: pip
    directory: '/decl-py'
    schedule: { interval: monthly }
    groups:
      pip-minor-patch: { patterns: ['*'], update-types: ['minor', 'patch'] }
      pip-major: { patterns: ['*'], update-types: ['major'] }
  - package-ecosystem: github-actions
    directory: '/'
    schedule: { interval: monthly }
    groups:
      actions-minor-patch: { patterns: ['*'], update-types: ['minor', 'patch'] }
      actions-major: { patterns: ['*'], update-types: ['major'] }
