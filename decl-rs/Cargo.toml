[package]
name = "decl-lang"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
description = "Decl — a declarative language for describing, generating, and validating structured data: the `decl` CLI (check / evaluate / validate / fmt) and the `decl-lsp` language server, implemented natively in Rust"
license = "MIT"
repository = "https://github.com/luuvish/decl-lang"
homepage = "https://github.com/luuvish/decl-lang"
documentation = "https://docs.rs/decl-lang"
keywords = ["decl", "declarative", "schema", "validation", "configuration"]
categories = ["command-line-utilities", "parser-implementations"]
readme = "README.md"
# grammar/ is generated by `npm run build` in ../decl-ts and gitignored;
# it must ship inside the crate for `cargo publish`
include = ["src/**", "build.rs", "grammar/**", "Cargo.toml", "README.md", "LICENSE"]

# docs.rs builds the crate page from README.md (lib.rs includes it) with every feature
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
name = "decl_lang"
path = "src/lib.rs"

[[bin]]
name = "decl"
path = "src/main.rs"

[[bin]]
name = "decl-lsp"
path = "src/lsp_main.rs"

[dependencies]
tree-sitter = "0.27"
tree-sitter-language = "0.1"
num-bigint = "0.5"
num-traits = "0.2"
num-integer = "0.1"
regex = "1"
sha2 = "0.11"
# the API returns roots by name in declaration order, as the reference does
indexmap = "2"
rustyline = "18"

[build-dependencies]
cc = "1"
