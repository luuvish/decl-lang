[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decl-lang"
version = "0.2.0"
description = "Decl — a declarative language for describing, generating, and validating structured data: native Python runtime, the decl CLI, formatter, LSP server, and a Python API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "luuvish" }]
keywords = ["decl", "declarative", "schema", "validation", "configuration", "json", "language", "lsp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["tree-sitter>=0.25"]

[project.optional-dependencies]
# pulls a Node.js runtime in through pip, for the static checker /
# formatter / LSP commands that run the bundled reference implementation
node = ["nodejs-wheel-binaries>=20"]

[project.scripts]
decl = "decl.cli:main"
decl-lsp = "decl.cli:lsp_main"

[project.urls]
Homepage = "https://github.com/luuvish/decl-lang"
Repository = "https://github.com/luuvish/decl-lang"
Issues = "https://github.com/luuvish/decl-lang/issues"

[tool.setuptools]
packages = ["decl", "decl.runtime", "decl._tree_sitter"]

# _js/ (bundled reference implementation) and _tree_sitter/src/ (grammar
# C sources) are generated by `npm run build` in ../decl-typescript and gitignored
[tool.setuptools.package-data]
decl = ["_js/*"]
"decl._tree_sitter" = ["binding.c", "src/*.c", "src/tree_sitter/*.h"]
