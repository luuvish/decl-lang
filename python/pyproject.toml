[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decl"
version = "0.2.0"
description = "Decl — a declarative language for describing, generating, and validating structured data: the decl CLI, formatter, LSP server, and a Python API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "luuvish" }]
keywords = ["decl", "declarative", "schema", "validation", "configuration", "json", "language", "lsp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
# pulls a Node.js runtime in through pip for environments without one
node = ["nodejs-wheel-binaries>=20"]

[project.scripts]
decl = "decl.cli:main"
decl-lsp = "decl.cli:lsp_main"

[project.urls]
Homepage = "https://github.com/luuvish/decl-lang"
Repository = "https://github.com/luuvish/decl-lang"
Issues = "https://github.com/luuvish/decl-lang/issues"

# _js/ is generated by `npm run build` in ../impl (bundled CLI, LSP,
# library, and the two wasm files) and is gitignored — include it anyway
[tool.hatch.build.targets.wheel]
packages = ["decl"]
artifacts = ["decl/_js/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["decl/_js/*", "LICENSE"]
